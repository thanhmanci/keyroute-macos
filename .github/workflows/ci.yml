name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Self-test
        run: swift run keyroute-selftest

      - name: Build app bundle
        run: scripts/build-app.sh

      - name: Verify app signature
        run: codesign --verify --deep --strict --verbose=2 dist/KeyRoute.app
